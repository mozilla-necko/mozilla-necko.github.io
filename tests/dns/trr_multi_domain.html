<!DOCTYPE html>
<html>
<head>
    <title>DNS Performance Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
        }
        .timing {
            color: #0066cc;
            font-weight: bold;
        }
        .results {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .image-item {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
            text-align: center;
        }
        .image-item img {
            width: 16px;
            height: 16px;
            display: block;
            margin: 5px auto;
        }
        .loaded {
            background: #d4edda;
            border-color: #28a745;
        }
        .failed {
            background: #f8d7da;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <h1>DNS Performance Test</h1>
    <p>Loading 50 favicons from different domains to measure DNS lookup performance...</p>

    <div class="status" id="status">
        Initializing test...
    </div>

    <div class="results" id="results">
        <div id="progress">Progress: 0/50</div>
        <div id="timing"></div>
    </div>

    <div class="image-grid" id="image-grid"></div>

    <script>
        const domains = [
            'google.com',
            'microsoft.com',
            'apple.com',
            'amazon.com',
            'facebook.com',
            'twitter.com',
            'linkedin.com',
            'github.com',
            'stackoverflow.com',
            'reddit.com',
            'wikipedia.org',
            'youtube.com',
            'netflix.com',
            'spotify.com',
            'adobe.com',
            'slack.com',
            'zoom.us',
            'paypal.com',
            'ebay.com',
            'airbnb.com',
            'salesforce.com',
            'twitch.tv',
            'cnn.com',
            'pinterest.com',
            'cloudflare.com',
            'medium.com',
            'shopify.com',
            'oracle.com',
            'ibm.com',
            'intel.com',
            'nvidia.com',
            'cisco.com',
            'hp.com',
            'dell.com',
            'walmart.com',
            'target.com',
            'bestbuy.com',
            'homedepot.com',
            'costco.com',
            'ikea.com',
            'uber.com',
            'lyft.com',
            'booking.com',
            'expedia.com',
            'tripadvisor.com',
            'yelp.com',
            'imdb.com',
            'espn.com',
            'nytimes.com',
            'bbc.com'
        ];

        const startTime = performance.now();
        let completed = 0;
        let successCount = 0;
        let failCount = 0;
        const imageGrid = document.getElementById('image-grid');

        // Create image elements for all domains
        domains.forEach((domain, index) => {
            const container = document.createElement('div');
            container.className = 'image-item';
            container.id = `item-${index}`;

            const domainDiv = document.createElement('div');
            domainDiv.textContent = domain;
            container.appendChild(domainDiv);

            const img = new Image();
            img.width = 16;
            img.height = 16;

            const requestStart = performance.now();
            const faviconPaths = ['/favicon.ico', '/favicon.png', '/apple-touch-icon.png'];
            let pathIndex = 0;

            function tryLoadFavicon() {
                img.src = `https://${domain}${faviconPaths[pathIndex]}`;
            }

            img.onload = () => {
                completed++;
                successCount++;
                const duration = (performance.now() - requestStart).toFixed(2);
                container.classList.add('loaded');

                container.textContent = '';
                const loadedImg = document.createElement('img');
                loadedImg.src = img.src;
                loadedImg.alt = domain;
                container.appendChild(loadedImg);

                const nameDiv = document.createElement('div');
                nameDiv.textContent = domain;
                container.appendChild(nameDiv);

                const timeDiv = document.createElement('div');
                timeDiv.style.color = 'green';
                timeDiv.style.fontSize = '10px';
                timeDiv.textContent = `${duration}ms`;
                container.appendChild(timeDiv);

                updateProgress();
            };

            img.onerror = () => {
                pathIndex++;
                if (pathIndex < faviconPaths.length) {
                    // Try next favicon path
                    tryLoadFavicon();
                } else {
                    // All paths failed
                    completed++;
                    failCount++;
                    const duration = (performance.now() - requestStart).toFixed(2);
                    container.classList.add('failed');

                    container.textContent = '';
                    const nameDiv = document.createElement('div');
                    nameDiv.textContent = domain;
                    container.appendChild(nameDiv);

                    const failDiv = document.createElement('div');
                    failDiv.style.color = 'red';
                    failDiv.style.fontSize = '10px';
                    failDiv.textContent = `Failed (${duration}ms)`;
                    container.appendChild(failDiv);

                    updateProgress();
                }
            };

            container.appendChild(img);
            imageGrid.appendChild(container);

            // Set src to trigger load
            tryLoadFavicon();
        });

        function updateProgress() {
            document.getElementById('progress').textContent =
                `Progress: ${completed}/50 | Success: ${successCount} | Failed: ${failCount}`;

            if (completed === domains.length) {
                const totalTime = (performance.now() - startTime).toFixed(2);
                document.getElementById('status').textContent =
                    `✓ Test completed: ${successCount} successful, ${failCount} failed`;

                const timingEl = document.getElementById('timing');
                timingEl.textContent = 'Total page load time: ';
                const span = document.createElement('span');
                span.className = 'timing';
                span.textContent = `${totalTime}ms`;
                timingEl.appendChild(span);

                // Show DNS timing details after a brief delay
                setTimeout(showDNSTiming, 500);
            }
        }

        function showDNSTiming() {
            const entries = performance.getEntriesByType('resource');
            const relevantEntries = entries.filter(e =>
                domains.some(d => e.name.includes(d))
            );

            if (relevantEntries.length) {
                const timingDiv = document.createElement('div');
                timingDiv.style.marginTop = '20px';

                const header = document.createElement('h3');
                header.textContent = 'DNS Lookup Times:';
                timingDiv.appendChild(header);

                let totalDNS = 0;
                let dnsCount = 0;

                relevantEntries.forEach(entry => {
                    const dnsTime = (entry.domainLookupEnd - entry.domainLookupStart).toFixed(2);
                    const domain = domains.find(d => entry.name.includes(d));
                    if (domain && dnsTime > 0) {
                        const entryDiv = document.createElement('div');
                        entryDiv.textContent = `${domain}: ${dnsTime}ms`;
                        timingDiv.appendChild(entryDiv);
                        totalDNS += parseFloat(dnsTime);
                        dnsCount++;
                    }
                });

                if (dnsCount > 0) {
                    const avgDNS = (totalDNS / dnsCount).toFixed(2);
                    const avgDiv = document.createElement('div');
                    avgDiv.style.marginTop = '10px';
                    avgDiv.style.fontWeight = 'bold';
                    avgDiv.textContent = `Average DNS lookup: ${avgDNS}ms`;
                    timingDiv.appendChild(avgDiv);
                }

                document.getElementById('results').appendChild(timingDiv);
            }
        }

        // Update initial status
        document.getElementById('status').textContent =
            `Loading ${domains.length} favicons from different domains...`;
    </script>
</body>
</html>
