        function showStatus(message) {
            const el = document.getElementById('status');
            el.style.display = 'block';
            el.textContent = message;
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            hideStatus();
        }

        function calculateStats(values) {
            if (values.length === 0) return null;
            const sorted = values.slice().sort((a, b) => a - b);
            const sum = sorted.reduce((a, b) => a + b, 0);
            const mean = sum / sorted.length;
            const mid = Math.floor(sorted.length / 2);
            const median = sorted.length % 2 === 0
                ? (sorted[mid - 1] + sorted[mid]) / 2
                : sorted[mid];
            const min = sorted[0];
            const max = sorted[sorted.length - 1];
            const variance = sorted.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / sorted.length;
            const stdDev = Math.sqrt(variance);
            const relStdDev = (stdDev / mean) * 100;
            return { mean, median, min, max, relStdDev, count: sorted.length };
        }

        async function fetchWithTiming(asset, iteration) {
            const startTime = performance.now();
            try {
                const cacheBustUrl = asset.url + (asset.url.includes('?') ? '&' : '?') + '_cb=' + Date.now() + Math.random();
                const response = await fetch(cacheBustUrl, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const reader = response.body.getReader();
                let receivedLength = 0;
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    receivedLength += value.length;
                }
                const endTime = performance.now();
                const duration = endTime - startTime;
                const throughputMbps = (receivedLength * 8 / 1000000) / (duration / 1000);
                return {
                    url: asset.url,
                    name: asset.name,
                    category: asset.category,
                    iteration,
                    duration,
                    bytes: receivedLength,
                    throughputMbps,
                    status: 'OK'
                };
            } catch (error) {
                const endTime = performance.now();
                return {
                    url: asset.url,
                    name: asset.name,
                    category: asset.category,
                    iteration,
                    duration: endTime - startTime,
                    bytes: 0,
                    throughputMbps: 0,
                    status: `Error: ${error.message}`
                };
            }
        }

        async function runSlidingWindowTest(assets, iterations, concurrency, onProgress) {
            const results = [];
            const tasks = [];
            for (let i = 0; i < iterations; i++) {
                for (const asset of assets) {
                    tasks.push({ asset, iteration: i + 1 });
                }
            }

            let nextIndex = 0;
            let completed = 0;
            const total = tasks.length;

            async function startRequest() {
                if (nextIndex >= tasks.length) return null;
                const { asset, iteration } = tasks[nextIndex++];
                const result = await fetchWithTiming(asset, iteration);
                results.push(result);
                completed++;
                onProgress(completed, total);
                return result;
            }

            const activePromises = new Set();
            for (let i = 0; i < Math.min(concurrency, tasks.length); i++) {
                const promise = startRequest().then(result => {
                    activePromises.delete(promise);
                    return result;
                });
                activePromises.add(promise);
            }

            while (activePromises.size > 0) {
                await Promise.race(activePromises);
                if (nextIndex < tasks.length) {
                    const promise = startRequest().then(result => {
                        activePromises.delete(promise);
                        return result;
                    });
                    activePromises.add(promise);
                }
            }

            return results;
        }

        function renderResults(results, container) {
            const section = document.createElement('div');
            section.className = 'results-section';

            const successfulResults = results.filter(r => r.status === 'OK');
            const failedResults = results.filter(r => r.status !== 'OK');
            const durations = successfulResults.map(r => r.duration);
            const throughputs = successfulResults.map(r => r.throughputMbps);
            const latencyStats = calculateStats(durations);
            const throughputStats = calculateStats(throughputs);

            const uniqueAssets = new Set(results.map(r => r.url)).size;

            let html = `<h2>Summary</h2>
                <div class="stats-row">
                    <span class="metric">
                        <div class="metric-label">Assets</div>
                        <div class="metric-value">${uniqueAssets}</div>
                    </span>
                    <span class="metric">
                        <div class="metric-label">Total Requests</div>
                        <div class="metric-value">${results.length}</div>
                    </span>
                    <span class="metric">
                        <div class="metric-label">Successful</div>
                        <div class="metric-value">${successfulResults.length}</div>
                    </span>
                    <span class="metric">
                        <div class="metric-label">Errors</div>
                        <div class="metric-value">${failedResults.length}</div>
                    </span>
                </div>
            <h2>Overall Statistics</h2>`;

            if (latencyStats) {
                html += `
                    <div class="stats-row">
                        <strong>Latency:</strong>
                        <span class="metric">
                            <div class="metric-label">Mean</div>
                            <div class="metric-value">${latencyStats.mean.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Median</div>
                            <div class="metric-value">${latencyStats.median.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Min</div>
                            <div class="metric-value">${latencyStats.min.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Max</div>
                            <div class="metric-value">${latencyStats.max.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Relative Std Dev</div>
                            <div class="metric-value">${latencyStats.relStdDev.toFixed(1)}%</div>
                        </span>
                    </div>
                    <div class="stats-row">
                        <strong>Throughput:</strong>
                        <span class="metric">
                            <div class="metric-label">Mean</div>
                            <div class="metric-value">${throughputStats.mean.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Median</div>
                            <div class="metric-value">${throughputStats.median.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Min</div>
                            <div class="metric-value">${throughputStats.min.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Max</div>
                            <div class="metric-value">${throughputStats.max.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Relative Std Dev</div>
                            <div class="metric-value">${throughputStats.relStdDev.toFixed(1)}%</div>
                        </span>
                    </div>
                `;
            }

            // Group by asset for per-asset stats
            const byAsset = {};
            for (const r of results) {
                if (!byAsset[r.url]) {
                    byAsset[r.url] = { name: r.name, category: r.category, results: [] };
                }
                byAsset[r.url].results.push(r);
            }

            html += `
                <h2>Per-Asset Results</h2>
                <details open>
                    <summary>${Object.keys(byAsset).length} assets, ${results.length} total requests</summary>
                    <table>
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Name</th>
                                <th>Size</th>
                                <th>Mean Latency</th>
                                <th>Mean Throughput</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const [url, data] of Object.entries(byAsset)) {
                const successful = data.results.filter(r => r.status === 'OK');
                const failed = data.results.length - successful.length;
                const avgDuration = successful.length > 0
                    ? successful.reduce((a, r) => a + r.duration, 0) / successful.length
                    : 0;
                const avgThroughput = successful.length > 0
                    ? successful.reduce((a, r) => a + r.throughputMbps, 0) / successful.length
                    : 0;
                const avgBytes = successful.length > 0
                    ? successful.reduce((a, r) => a + r.bytes, 0) / successful.length
                    : 0;

                const sizeStr = avgBytes > 1000000
                    ? `${(avgBytes / 1000000).toFixed(2)} MB`
                    : avgBytes > 1000
                        ? `${(avgBytes / 1000).toFixed(1)} KB`
                        : `${avgBytes.toFixed(0)} B`;

                const statusStr = failed > 0 ? `${successful.length}/${data.results.length} OK` : 'OK';

                html += `
                    <tr>
                        <td>${data.category}</td>
                        <td>${data.name}</td>
                        <td>${sizeStr}</td>
                        <td>${avgDuration.toFixed(2)} ms</td>
                        <td>${avgThroughput.toFixed(2)} Mbps</td>
                        <td>${statusStr}</td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </details>
            `;

            // Raw results
            html += `
                <details>
                    <summary>Raw results (${results.length} requests)</summary>
                    <table>
                        <thead>
                            <tr>
                                <th>Iter</th>
                                <th>Category</th>
                                <th>Name</th>
                                <th>Duration (ms)</th>
                                <th>Throughput (Mbps)</th>
                                <th>Bytes</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const r of results) {
                html += `
                    <tr>
                        <td>${r.iteration}</td>
                        <td>${r.category}</td>
                        <td>${r.name}</td>
                        <td>${r.duration.toFixed(2)}</td>
                        <td>${r.throughputMbps.toFixed(2)}</td>
                        <td>${r.bytes.toLocaleString()}</td>
                        <td>${r.status}</td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </details>
            `;

            section.innerHTML = html;
            container.appendChild(section);
        }

        async function runBenchmark() {
            const concurrency = parseInt(document.getElementById('concurrency').value, 10);
            const iterations = parseInt(document.getElementById('iterations').value, 10);
            const resultsContainer = document.getElementById('results');

            resultsContainer.innerHTML = '';

            showStatus(`Running benchmark: 0/${ASSETS.length * iterations} requests...`);

            const results = await runSlidingWindowTest(
                ASSETS,
                iterations,
                concurrency,
                (completed, total) => {
                    showStatus(`Running benchmark: ${completed}/${total} requests...`);
                }
            );

            renderResults(results, resultsContainer);

            showStatus('Benchmark complete!');
            setTimeout(hideStatus, 2000);
        }
    </script>
