<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Download Benchmark</title>
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 20px auto; padding: 20px; font-size: 14px; }
        h1 { font-size: 24px; }
        h2 { font-size: 18px; margin-top: 30px; }
        h3 { font-size: 16px; }
        button { padding: 8px 16px; font-size: 14px; margin: 15px 5px 15px 0; }
        .config { margin: 15px 0; padding: 15px; background: #f0f0f0; border-radius: 4px; }
        .config label { margin-right: 20px; }
        .config input { width: 60px; margin-right: 5px; }
        .metric { display: inline-block; margin: 8px 16px 8px 0; padding: 8px 12px; background: #f5f5f5; border-radius: 4px; }
        .metric-label { font-weight: bold; font-size: 12px; color: #666; }
        .metric-value { font-size: 18px; color: #0066cc; }
        .stats-row { margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 12px; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        .status { padding: 10px; margin: 10px 0; background: #e8f4fd; border-radius: 4px; }
        .size-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .size-header { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .progress { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>Parallel Download Benchmark</h1>
    <p>Measures request latency and throughput using a sliding window of concurrent requests across different file sizes.</p>

    <div class="config">
        <label>Concurrent requests: <input type="number" id="concurrency" value="20" min="1" max="50"></label>
        <label>Requests per size: <input type="number" id="requestCount" value="200" min="5" max="500"></label>
    </div>

    <button onclick="runBenchmark()">Run Benchmark</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="status" class="status" style="display: none;"></div>

    <div id="results"></div>

    <script>
        const SIZES = [
            { label: '10 KB', bytes: 10000 },
            { label: '50 KB', bytes: 50000 },
            { label: '100 KB', bytes: 100000 },
            { label: '500 KB', bytes: 500000 }
        ];

        const BASE_URL = 'https://speed.cloudflare.com/__down';

        function showStatus(message) {
            const el = document.getElementById('status');
            el.style.display = 'block';
            el.textContent = message;
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            hideStatus();
        }

        function calculateStats(values) {
            if (values.length === 0) return null;
            const sorted = values.slice().sort((a, b) => a - b);
            const sum = sorted.reduce((a, b) => a + b, 0);
            const mean = sum / sorted.length;
            const mid = Math.floor(sorted.length / 2);
            const median = sorted.length % 2 === 0
                ? (sorted[mid - 1] + sorted[mid]) / 2
                : sorted[mid];
            const min = sorted[0];
            const max = sorted[sorted.length - 1];
            const variance = sorted.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / sorted.length;
            const stdDev = Math.sqrt(variance);
            const relStdDev = (stdDev / mean) * 100;
            return { mean, median, min, max, relStdDev, count: sorted.length };
        }

        async function fetchWithTiming(url, index) {
            const startTime = performance.now();
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const reader = response.body.getReader();
                let receivedLength = 0;
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    receivedLength += value.length;
                }
                const endTime = performance.now();
                const duration = endTime - startTime;
                const throughputMbps = (receivedLength * 8 / 1000000) / (duration / 1000);
                return {
                    index,
                    duration,
                    bytes: receivedLength,
                    throughputMbps,
                    status: 'OK',
                    startTime,
                    endTime
                };
            } catch (error) {
                const endTime = performance.now();
                return {
                    index,
                    duration: endTime - startTime,
                    bytes: 0,
                    status: `Error: ${error.message}`,
                    startTime,
                    endTime
                };
            }
        }

        async function runSlidingWindowTest(bytes, totalRequests, concurrency, onProgress) {
            const url = `${BASE_URL}?bytes=${bytes}`;
            const results = [];
            let nextIndex = 0;
            let completed = 0;

            async function startRequest() {
                if (nextIndex >= totalRequests) return null;
                const index = nextIndex++;
                const result = await fetchWithTiming(url, index);
                results.push(result);
                completed++;
                onProgress(completed, totalRequests);
                return result;
            }

            // Start initial batch
            const activePromises = new Set();
            for (let i = 0; i < Math.min(concurrency, totalRequests); i++) {
                const promise = startRequest().then(result => {
                    activePromises.delete(promise);
                    return result;
                });
                activePromises.add(promise);
            }

            // Sliding window: as each completes, start another
            while (activePromises.size > 0) {
                await Promise.race(activePromises);
                // Start new request if we have more to do
                if (nextIndex < totalRequests) {
                    const promise = startRequest().then(result => {
                        activePromises.delete(promise);
                        return result;
                    });
                    activePromises.add(promise);
                }
            }

            // Sort by original index for display
            results.sort((a, b) => a.index - b.index);
            return results;
        }

        function renderSizeResults(size, results, container) {
            const section = document.createElement('div');
            section.className = 'size-section';

            const successfulResults = results.filter(r => r.status === 'OK');
            const durations = successfulResults.map(r => r.duration);
            const throughputs = successfulResults.map(r => r.throughputMbps);
            const latencyStats = calculateStats(durations);
            const throughputStats = calculateStats(throughputs);

            let html = `<div class="size-header">${size.label} (${size.bytes.toLocaleString()} bytes)</div>`;

            if (latencyStats) {
                html += `
                    <div class="stats-row">
                        <strong>Latency:</strong>
                        <span class="metric">
                            <div class="metric-label">Mean</div>
                            <div class="metric-value">${latencyStats.mean.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Median</div>
                            <div class="metric-value">${latencyStats.median.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Min</div>
                            <div class="metric-value">${latencyStats.min.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Max</div>
                            <div class="metric-value">${latencyStats.max.toFixed(2)} ms</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Relative Std Dev</div>
                            <div class="metric-value">${latencyStats.relStdDev.toFixed(1)}%</div>
                        </span>
                    </div>
                    <div class="stats-row">
                        <strong>Throughput:</strong>
                        <span class="metric">
                            <div class="metric-label">Mean</div>
                            <div class="metric-value">${throughputStats.mean.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Median</div>
                            <div class="metric-value">${throughputStats.median.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Min</div>
                            <div class="metric-value">${throughputStats.min.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Max</div>
                            <div class="metric-value">${throughputStats.max.toFixed(2)} Mbps</div>
                        </span>
                        <span class="metric">
                            <div class="metric-label">Relative Std Dev</div>
                            <div class="metric-value">${throughputStats.relStdDev.toFixed(1)}%</div>
                        </span>
                    </div>
                `;
            }

            html += `
                <details>
                    <summary>Raw results (${results.length} requests, ${successfulResults.length} successful)</summary>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Duration (ms)</th>
                                <th>Throughput (Mbps)</th>
                                <th>Bytes</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const r of results) {
                const throughput = r.throughputMbps ? r.throughputMbps.toFixed(2) : 'N/A';
                html += `
                    <tr>
                        <td>${r.index + 1}</td>
                        <td>${r.duration.toFixed(2)}</td>
                        <td>${throughput}</td>
                        <td>${r.bytes.toLocaleString()}</td>
                        <td>${r.status}</td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </details>
            `;

            section.innerHTML = html;
            container.appendChild(section);
        }

        async function runBenchmark() {
            const concurrency = parseInt(document.getElementById('concurrency').value, 10);
            const requestCount = parseInt(document.getElementById('requestCount').value, 10);
            const resultsContainer = document.getElementById('results');

            resultsContainer.innerHTML = '';

            for (const size of SIZES) {
                showStatus(`Testing ${size.label}: 0/${requestCount} requests...`);

                const results = await runSlidingWindowTest(
                    size.bytes,
                    requestCount,
                    concurrency,
                    (completed, total) => {
                        showStatus(`Testing ${size.label}: ${completed}/${total} requests...`);
                    }
                );

                renderSizeResults(size, results, resultsContainer);
            }

            hideStatus();
            showStatus('Benchmark complete!');
            setTimeout(hideStatus, 2000);
        }
    </script>
</body>
</html>
